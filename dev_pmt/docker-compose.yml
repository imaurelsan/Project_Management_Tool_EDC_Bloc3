services:
  mysql:
    image: mysql:8.0
    container_name: pmt_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: mon_mot_2_p@sse_PMT
      MYSQL_DATABASE: pmt_db
    ports:
      - "3306:3306"
    volumes:
      - pmt_mysql_data:/var/lib/mysql
      - ./database/init.sql:/docker-entrypoint-initdb.d/init.sql:ro

volumes:
  pmt_mysql_data: